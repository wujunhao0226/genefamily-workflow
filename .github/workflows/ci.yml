name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Unit tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests
      - name: Run tests
        run: pytest -q

  pipeline:
    name: End-to-end toy pipeline (HMMER + Clustal Omega + IQ-TREE)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: mamba-org/setup-micromamba@v3
        with:
          environment-name: gf
          condarc: |
            channels:
              - conda-forge
              - bioconda
            channel_priority: strict
          create-args: >-
            python=3.11
            hmmer
            clustalo
            iqtree
          cache-environment: true

      - name: Install package
        shell: bash -el {0}
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Run pipeline on synthetic data
        shell: bash -el {0}
        run: |
          bash scripts/run_toy_pipeline.sh

      - name: Inspect key outputs
        shell: bash -el {0}
        run: |
          test -s results/tree.treefile
          test -s results/alignment.faa
          test -s results/gene_structure.tsv
          test -s results/expression_summary.tsv
          test -s results/figures/circular_tree.png
          echo "alignment columns: $(grep -c '^>' results/alignment.faa) sequences"

      - uses: actions/upload-artifact@v4
        with:
          name: toy-results
          path: results/
          retention-days: 7
